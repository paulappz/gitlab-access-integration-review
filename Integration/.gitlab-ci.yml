stages:
  - test

unit-tests:
  stage: test
  image: python:3.9-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v
  variables:
    GITLAB_URL: "https://gitlab.example.com"  # Override in GitLab CI settings
    PRIVATE_TOKEN: "$ACCESS_TOKEN"            # GitLab CI variable (masked)